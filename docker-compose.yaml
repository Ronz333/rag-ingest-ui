services:
  rag-ingest-ui:
    build: .
    ports:
      - "7861:7861"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - QDRANT_HOST=http://qdrant:6333
      - OLLAMA_MODEL=hf.co/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:Q4_1
      - CLEF_MODEL=cloudflare/clef-27b
    dns:
      - 1.1.1.1
      - 8.8.8.8
    tmpfs:
      - /tmp:exec,mode=777,size=4G
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - ./data:/app/data
    networks:
      - coolify

networks:
  coolify:
    external: true
