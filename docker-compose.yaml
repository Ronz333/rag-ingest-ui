services:
  rag-ingest-ui:
    build: .
    ports:
      - "7861:7861"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - QDRANT_HOST=http://qdrant:6333
      - OLLAMA_MODEL=hf.co/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:Q4_1
    volumes:
      # Mountet die JSON-Dateien direkt vom Host in den Container
      - ./oshw_sources.json:/app/oshw_sources.json
      - ./repo_filters.json:/app/repo_filters.json
    networks:
      - coolify

networks:
  coolify:
    external: true
